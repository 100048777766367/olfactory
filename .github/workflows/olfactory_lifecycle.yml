name: Vòng Đời Khứu Giác Tự Trị (Olfactory HA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '20 */6 * * *'

permissions:
  contents: write

jobs:
  run-olfactory:
    runs-on: ubuntu-latest
    steps:
      - name: Kéo mã nguồn Mũi
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 1. DÒ TÌM ĐẠO HÀM PHẢN HỒI TỪ BỘ NÃO
      - name: Xúc tu vươn vòi tìm Não phả hệ
        env:
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_PARENT: ${{ github.event.repository.parent.owner.login }}
        run: python receptors/cascade_receptor.py

      - name: Anten bắt sóng Bộ Não toàn cầu
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python receptors/mesh_receptor.py

      # 2. MÀNG MIỄN DỊCH KIỂM ĐỊNH ĐẠO HÀM
      - name: Màng miễn dịch kiểm định đạo hàm
        run: python receptors/contract_receptor.py

      # 3. VẬN HÀNH MŨI HÍT MÙI
      - name: Vận hành Động cơ Khứu giác
        run: python olfactory_engine.py

      # 4. LƯU VẾT TÍCH VÀO GIT (FAST-FORWARD CHỐNG CONFLICT)
      - name: Phát xung khứu giác lên môi trường mạng
        run: |
          git config --global user.name "Olfactory-Nose-Bot"
          git config --global user.email "bot@olfactory.node"
          
          git fetch origin main
          git reset origin/main
          git add synapses/ synapse_forward.json 2>/dev/null || true
          
          if ! git diff --staged --quiet; then
            git commit -m "👃 [Xung Khứu Giác] Mũi vừa phân tích dấu vân tay hóa học [skip ci]"
            git push origin main
          else
            echo "Không có biến đổi mới."
          fi
